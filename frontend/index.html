<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMDAS Control Plane</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SAMDAS <span class="highlight">Control Plane</span></h1>
            <p>Zero-Trust Cognitive Firewall Monitor</p>
        </header>

        <main>
            <div class="panel">
                <h2>Immutable Ledger Logs</h2>
                <p>Live stream of verified AI cryptographic sessions.</p>
                
                <table id="ledger-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Timestamp</th>
                            <th>Root Hash (SHA-256)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="ledger-body">
                        <!-- JavaScript will inject the rows here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
